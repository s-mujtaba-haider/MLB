name: tests

on:
  push:
    branches: [main, mlb-phase1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests
        # No network and no API key: the suite is built entirely on synthetic
        # markets with known pathologies, so it must pass without either.
        run: python -m pytest tests/ -q --maxfail=1
